name: Bug report
description: Report incorrect output, an unexpected error, or a validation gap.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a small, runnable reproduction. Report vulnerabilities
        privately as described in SECURITY.md instead of using this form.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v22.x
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: Include the points, supplied edges, and options you passed.
      render: javascript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the returned edges or complete error output.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The result is reproducible with the input above.
          required: true
        - label: I noted whether repeated runs produce the same output.
          required: true
