name: Stage npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0 --ignore-scripts
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Verify release tag
        run: >-
          node --input-type=module -e
          "import{readFileSync}from'node:fs';
          const version=JSON.parse(readFileSync('package.json')).version;
          const expected='v'+version;
          if(expected!==process.env.GITHUB_REF_NAME)
          throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match '+expected)"
      - name: Check source, types, tests, and coverage
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Stage package for maintainer approval
        run: npm stage publish --access public --ignore-scripts
